<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CHESS 2 DOUBLE — 4 Jugadores, 2 Tableros</title>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800;900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    /* ============ VARIABLES DE DISEÑO ============ */
    :root {
      --gold-primary: #d4af37;
      --gold-light: #f0e68c;
      --gold-dark: #aa8c2e;
      --blue-dark: #0a1426;
      --blue-mid: #1a2847;
      --blue-light: #2d3f5f;
      --accent-purple: #8b3a8b;
      --wood-light: #daa76b;
      --wood-mid: #8b6f47;
      --wood-dark: #4a3728;
      --silver: #e8e8e8;
      --text-light: #f5f5f5;
      --text-dark: #1a1a1a;
    }

    body {
      background: linear-gradient(135deg, var(--blue-dark) 0%, #0f1b2e 25%, #1a1830 50%, #0f1b2e 75%, var(--blue-dark) 100%);
      background-attachment: fixed;
      color: var(--text-light);
      font-family: 'Inter', sans-serif;
      min-height: 100vh;
      overflow-x: hidden;
      position: relative;
    }

    /* Efecto de brillo ambient */
    body::before {
      content: '';
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: 
        radial-gradient(ellipse 80% 50% at 50% 0%, rgba(212, 175, 55, 0.15), transparent 60%),
        radial-gradient(ellipse 60% 60% at 50% 50%, rgba(30, 60, 90, 0.3), transparent 70%);
      pointer-events: none;
      z-index: -1;
    }

    /* ============ CONTAINER PRINCIPAL ============ */
    .container {
      max-width: 1400px;
      margin: 0 auto;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 30px;
    }

    /* ============ HEADER SECTION ============ */
    .header-section {
      text-align: center;
      position: relative;
      padding: 40px 20px;
    }

    /* Decoración de corona superior */
    .crown-row {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 15px;
      margin-bottom: 30px;
      flex-wrap: wrap;
    }

    .crown {
      width: 60px;
      height: 60px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 50px;
      text-shadow: 
        0 0 20px rgba(212, 175, 55, 0.6),
        0 2px 10px rgba(0, 0, 0, 0.8);
      filter: drop-shadow(0 0 10px rgba(212, 175, 55, 0.4));
      animation: crownFloat 3s ease-in-out infinite;
    }

    .crown:nth-child(1) { animation-delay: 0s; }
    .crown:nth-child(2) { animation-delay: 0.3s; }
    .crown:nth-child(3) { animation-delay: 0.6s; }
    .crown:nth-child(4) { animation-delay: 0.9s; }
    .crown:nth-child(5) { animation-delay: 1.2s; }
    .crown:nth-child(6) { animation-delay: 1.5s; }
    .crown:nth-child(7) { animation-delay: 1.8s; }
    .crown:nth-child(8) { animation-delay: 2.1s; }

    @keyframes crownFloat {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-8px); }
    }

    /* Título principal */
    .game-title {
      position: relative;
      margin: 30px 0 20px;
      z-index: 10;
    }

    .title-text {
      font-family: 'Cinzel', serif;
      font-size: clamp(48px, 8vw, 96px);
      font-weight: 900;
      color: var(--gold-light);
      letter-spacing: 3px;
      text-shadow:
        0 4px 20px rgba(212, 175, 55, 0.5),
        0 8px 40px rgba(0, 0, 0, 0.8);
      margin: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 15px;
      flex-wrap: wrap;
    }

    /* Número "2" con estilo especial */
    .number-badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 80px;
      height: 80px;
      background: linear-gradient(135deg, #8b3a8b 0%, #a04fa0 50%, #8b3a8b 100%);
      border: 3px solid var(--gold-primary);
      border-radius: 50%;
      font-size: 60px;
      font-weight: 900;
      color: var(--gold-light);
      font-family: 'Cinzel', serif;
      box-shadow:
        0 0 30px rgba(212, 175, 55, 0.6),
        inset 0 0 20px rgba(139, 58, 139, 0.5),
        0 8px 20px rgba(0, 0, 0, 0.8);
      animation: badgePulse 2s ease-in-out infinite;
    }

    @keyframes badgePulse {
      0%, 100% { 
        box-shadow:
          0 0 30px rgba(212, 175, 55, 0.6),
          inset 0 0 20px rgba(139, 58, 139, 0.5),
          0 8px 20px rgba(0, 0, 0, 0.8);
      }
      50% { 
        box-shadow:
          0 0 50px rgba(212, 175, 55, 0.9),
          inset 0 0 30px rgba(139, 58, 139, 0.8),
          0 12px 30px rgba(0, 0, 0, 1);
      }
    }

    /* Línea decorativa */
    .title-underline {
      width: 100%;
      height: 3px;
      background: linear-gradient(90deg, 
        transparent, 
        var(--gold-primary) 10%, 
        var(--gold-light) 50%, 
        var(--gold-primary) 90%, 
        transparent);
      margin: 20px 0;
      box-shadow: 0 0 20px rgba(212, 175, 55, 0.4);
    }

    /* Subtítulo */
    .subtitle {
      font-family: 'Cinzel', serif;
      font-size: clamp(16px, 2vw, 24px);
      color: var(--gold-primary);
      letter-spacing: 2px;
      text-transform: uppercase;
      text-shadow: 0 2px 8px rgba(0, 0, 0, 0.7);
      margin-top: 15px;
    }

    .subtitle-item {
      display: inline-block;
      margin: 0 10px;
    }

    .subtitle-item::before {
      content: '◆';
      margin-right: 8px;
      color: var(--gold-light);
    }

    /* ============ GAME BOARD SECTION ============ */
    .board-container {
      display: flex;
      justify-content: center;
      gap: 40px;
      margin: 40px auto;
      flex-wrap: wrap;
      position: relative;
      z-index: 5;
    }

    /* Panel del jugador */
    .player-panel {
      flex: 1;
      min-width: 350px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
    }

    .player-header {
      display: flex;
      align-items: center;
      gap: 15px;
      justify-content: center;
      padding: 15px 25px;
      background: linear-gradient(135deg, rgba(212, 175, 55, 0.2), rgba(212, 175, 55, 0.05));
      border: 2px solid var(--gold-primary);
      border-radius: 10px;
      backdrop-filter: blur(10px);
      width: 100%;
    }

    .player-king {
      font-size: 40px;
      filter: drop-shadow(0 0 10px rgba(212, 175, 55, 0.6));
    }

    .player-info {
      display: flex;
      flex-direction: column;
      gap: 5px;
    }

    .player-number {
      font-size: 12px;
      color: var(--gold-primary);
      text-transform: uppercase;
      letter-spacing: 1px;
      font-weight: 700;
    }

    .player-name {
      font-size: 16px;
      font-weight: 600;
      color: var(--text-light);
    }

    /* Tablero de ajedrez */
    .chess-board {
      aspect-ratio: 1;
      width: 100%;
      max-width: 500px;
      background: linear-gradient(135deg, var(--wood-dark) 0%, var(--wood-mid) 50%, var(--wood-dark) 100%);
      border: 8px solid var(--wood-dark);
      box-shadow:
        0 20px 60px rgba(0, 0, 0, 0.8),
        inset 0 0 30px rgba(0, 0, 0, 0.5),
        0 0 40px rgba(212, 175, 55, 0.2);
      display: grid;
      grid-template-columns: repeat(8, 1fr);
      gap: 0;
      padding: 0;
      position: relative;
    }

    .chess-board::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      border-radius: 0;
      box-shadow: inset 0 0 40px rgba(0, 0, 0, 0.4);
      pointer-events: none;
      z-index: 1;
    }

    .board-square {
      aspect-ratio: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      position: relative;
      transition: all 0.2s ease;
      font-size: 2vw;
    }

    .board-square:hover {
      filter: brightness(1.1);
    }

    .board-square.light {
      background-color: var(--wood-light);
      border: 1px solid rgba(212, 175, 55, 0.1);
    }

    .board-square.dark {
      background-color: var(--wood-dark);
      border: 1px solid rgba(0, 0, 0, 0.3);
    }

    .board-square.selected {
      background: radial-gradient(circle, var(--gold-light) 0%, var(--gold-primary) 50%);
      box-shadow: inset 0 0 15px rgba(212, 175, 55, 0.6);
    }

    /* Decoración de coordenadas */
    .board-coord {
      position: absolute;
      font-family: 'Cinzel', serif;
      font-weight: 700;
      font-size: 12px;
      color: var(--gold-primary);
      text-shadow: 0 1px 3px rgba(0, 0, 0, 0.8);
      opacity: 0.6;
    }

    .board-coord.file {
      bottom: -25px;
      left: 50%;
      transform: translateX(-50%);
    }

    .board-coord.rank {
      left: -25px;
      top: 50%;
      transform: translateY(-50%);
    }

    /* ============ PLAYER KINGS SHOWCASE ============ */
    .kings-showcase {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 20px;
      margin: 40px 0;
      flex-wrap: wrap;
      position: relative;
    }

    .king-display {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      padding: 20px;
      background: linear-gradient(135deg, rgba(212, 175, 55, 0.1), rgba(212, 175, 55, 0.02));
      border: 2px solid var(--gold-primary);
      border-radius: 8px;
      backdrop-filter: blur(10px);
      min-width: 100px;
    }

    .king-icon {
      font-size: 50px;
      filter: drop-shadow(0 0 15px rgba(212, 175, 55, 0.6));
    }

    .king-label {
      font-size: 12px;
      color: var(--gold-primary);
      text-transform: uppercase;
      letter-spacing: 1px;
      font-weight: 700;
    }

    /* ============ CONTROLES ============ */
    .controls {
      display: flex;
      justify-content: center;
      gap: 15px;
      flex-wrap: wrap;
      margin-top: 40px;
    }

    .btn {
      padding: 12px 30px;
      background: linear-gradient(135deg, var(--gold-primary), var(--gold-dark));
      color: var(--text-dark);
      border: 2px solid var(--gold-light);
      border-radius: 8px;
      font-family: 'Cinzel', serif;
      font-size: 14px;
      font-weight: 700;
      letter-spacing: 1px;
      cursor: pointer;
      transition: all 0.3s ease;
      text-transform: uppercase;
      box-shadow: 0 4px 15px rgba(212, 175, 55, 0.3);
      text-shadow: 0 1px 2px rgba(0, 0, 0, 0.2);
    }

    .btn:hover {
      background: linear-gradient(135deg, var(--gold-light), var(--gold-primary));
      transform: translateY(-2px);
      box-shadow: 0 6px 25px rgba(212, 175, 55, 0.5);
    }

    .btn:active {
      transform: translateY(0);
    }

    .btn.secondary {
      background: linear-gradient(135deg, rgba(212, 175, 55, 0.2), rgba(212, 175, 55, 0.1));
      color: var(--gold-light);
      border-color: var(--gold-primary);
    }

    .btn.secondary:hover {
      background: linear-gradient(135deg, rgba(212, 175, 55, 0.3), rgba(212, 175, 55, 0.2));
    }

    /* ============ RESPONSIVE ============ */
    @media (max-width: 1024px) {
      .container {
        padding: 15px;
        gap: 20px;
      }

      .board-container {
        gap: 20px;
      }

      .player-panel {
        min-width: 280px;
      }

      .chess-board {
        max-width: 400px;
      }

      .number-badge {
        width: 60px;
        height: 60px;
        font-size: 45px;
      }
    }

    @media (max-width: 768px) {
      .title-text {
        font-size: 42px;
        gap: 10px;
      }

      .number-badge {
        width: 50px;
        height: 50px;
        font-size: 35px;
      }

      .board-container {
        flex-direction: column;
        gap: 30px;
      }

      .player-panel {
        width: 100%;
      }

      .chess-board {
        max-width: 100%;
      }

      .subtitle {
        font-size: 14px;
      }

      .subtitle-item {
        display: block;
        margin: 5px 0;
      }
    }

    /* ============ ANIMACIONES ESPECIALES ============ */
    @keyframes glowPulse {
      0%, 100% { filter: drop-shadow(0 0 10px rgba(212, 175, 55, 0.4)); }
      50% { filter: drop-shadow(0 0 20px rgba(212, 175, 55, 0.8)); }
    }

    .chess-board {
      animation: glowPulse 3s ease-in-out infinite;
    }

  </style>
</head>
<body>
  <div class="container">
    <!-- HEADER CON CORONAS -->
    <div class="header-section">
      <div class="crown-row">
        <div class="crown">♔</div>
        <div class="crown">♚</div>
        <div class="crown">♔</div>
        <div class="crown">♚</div>
        <div class="crown">♔</div>
        <div class="crown">♚</div>
        <div class="crown">♔</div>
        <div class="crown">♚</div>
      </div>

      <div class="game-title">
        <span class="title-text">
          CHESS
          <span class="number-badge">2</span>
          DOUBLE
        </span>
      </div>

      <div class="title-underline"></div>

      <div class="subtitle">
        <span class="subtitle-item">4 JUGADORES</span>
        <span class="subtitle-item">2 TABLEROS</span>
        <span class="subtitle-item">1 BATALLA ÉPICA</span>
      </div>
    </div>

    <!-- TABLEROS DE JUEGO -->
    <div class="board-container">
      <!-- Panel Jugador 1 (Blancas) -->
      <div class="player-panel">
        <div class="player-header">
          <div class="player-king">♔</div>
          <div class="player-info">
            <div class="player-number">Jugador 1</div>
            <div class="player-name">BLANCAS</div>
          </div>
        </div>
        <div class="chess-board" id="board1">
          <!-- Tablero 1 generado por JavaScript -->
        </div>
      </div>

      <!-- Panel Jugador 2 (Negras) -->
      <div class="player-panel">
        <div class="player-header">
          <div class="player-king">♚</div>
          <div class="player-info">
            <div class="player-number">Jugador 2</div>
            <div class="player-name">NEGRAS</div>
          </div>
        </div>
        <div class="chess-board" id="board2">
          <!-- Tablero 2 generado por JavaScript -->
        </div>
      </div>
    </div>

    <!-- EXHIBICIÓN DE REYES DE LOS 4 JUGADORES -->
    <div class="kings-showcase">
      <div class="king-display">
        <div class="king-icon">♔</div>
        <div class="king-label">Jugador 1</div>
      </div>
      <div class="king-display">
        <div class="king-icon">♚</div>
        <div class="king-label">Jugador 2</div>
      </div>
      <div class="king-display">
        <div class="king-icon">♕</div>
        <div class="king-label">Jugador 3</div>
      </div>
      <div class="king-display">
        <div class="king-icon">♛</div>
        <div class="king-label">Jugador 4</div>
      </div>
    </div>

    <!-- CONTROLES -->
    <div class="controls">
      <button class="btn">Nuevo Juego</button>
      <button class="btn secondary">Cargar Juego</button>
      <button class="btn secondary">Ver Reglas</button>
      <button class="btn secondary">Configuración</button>
    </div>
  </div>

  <script>
    // Generar tableros de ajedrez
    function generateChessBoard(boardId, startColor = 'light') {
      const board = document.getElementById(boardId);
      const coordinates = ['a', 'b', 'c', 'd', 'e', 'f', 'g', 'h'];

      for (let rank = 8; rank >= 1; rank--) {
        for (let file = 0; file < 8; file++) {
          const square = document.createElement('div');
          const isLight = (file + rank) % 2 === 0;
          square.className = `board-square ${isLight ? 'light' : 'dark'}`;
          square.dataset.square = coordinates[file] + rank;
          
          // Añadir coordenadas en esquinas
          if (file === 0) {
            const rankLabel = document.createElement('span');
            rankLabel.className = 'board-coord rank';
            rankLabel.textContent = rank;
            square.appendChild(rankLabel);
          }
          
          if (rank === 1) {
            const fileLabel = document.createElement('span');
            fileLabel.className = 'board-coord file';
            fileLabel.textContent = coordinates[file];
            square.appendChild(fileLabel);
          }

          // Evento click para demostración
          square.addEventListener('click', function(e) {
            if (e.target === this) {
              document.querySelectorAll('.board-square.selected').forEach(s => {
                s.classList.remove('selected');
              });
              this.classList.add('selected');
            }
          });

          board.appendChild(square);
        }
      }
    }

    // Inicializar tableros
    generateChessBoard('board1');
    generateChessBoard('board2');

    // Eventos de botones (demostración)
    document.querySelectorAll('.btn').forEach(btn => {
      btn.addEventListener('click', function(e) {
        e.preventDefault();
        const action = this.textContent.trim();
        alert('Acción: ' + action);
      });
    });

    // Efecto de brillo al mover mouse
    document.addEventListener('mousemove', function(e) {
      const chess = document.querySelectorAll('.chess-board');
      chess.forEach(board => {
        const rect = board.getBoundingClientRect();
        const x = e.clientX - rect.left;
        const y = e.clientY - rect.top;
        const intensity = Math.max(0, 1 - (Math.sqrt(x*x + y*y) / 500));
        board.style.filter = `brightness(${1 + intensity * 0.1})`;
      });
    });
  </script>
</body>
</html>
